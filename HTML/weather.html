<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Weather Forecast Sandbox Edition</title>
    <style>
        /* --- Native Home Assistant Color Profiles --- */
        :root {
            --bg-color: #0f0f11;
            --card-color: #16161a;
            --text-color: #f1f5f9;
            --accent-color: #38bdf8;
            --border-color: #27272a;
            --sub-text: #a1a1aa;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        html, body {
            background-color: var(--bg-color);
            overflow: hidden;
            width: 100%;
            height: 100%;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: var(--text-color);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* 
           The Core Framework Container:
           We lock this to absolute full-viewport proportions.
           All child elements will scale relative to this master wrapper.
        */
        .container {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* Hero Weather Card */
        .weather-card {
            background-color: var(--card-color);
            border: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }

        .hero-left {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 100%;
        }

        .location-title {
            font-weight: 600;
            line-height: 1.2;
        }

        .condition-state {
            color: var(--sub-text);
            text-transform: capitalize;
            line-height: 1.2;
        }

        .temp-display {
            font-weight: 500;
            line-height: 0.9;
        }

        .hero-right {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            justify-content: space-between;
            height: 100%;
        }

        .weather-icon {
            line-height: 1;
        }

        .extra-metrics {
            color: var(--sub-text);
            text-align: right;
            line-height: 1.4;
        }

        /* Forecast Strip Component */
        .forecast-strip {
            background-color: var(--card-color);
            border: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }

        .forecast-day {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            flex: 1;
            height: 100%;
            text-align: center;
            border-right: 1px solid var(--border-color);
        }

        .forecast-day:last-child {
            border-right: none;
        }

        .day-name {
            font-weight: 600;
            color: var(--text-color);
        }

        .day-temp-high {
            font-weight: 600;
            color: var(--text-color);
        }

        /* --- Secure Token Configuration Prompt Overlay --- */
        .token-gate {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(15, 15, 17, 0.98);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            z-index: 9999;
        }

        .gate-box {
            background: var(--card-color);
            border: 1px solid var(--border-color);
            padding: 30px;
            border-radius: 12px;
            max-width: 500px;
            width: 100%;
            text-align: center;
        }

        .gate-box h2 { font-size: 1.8rem; margin-bottom: 12px; }
        .gate-box p { color: var(--sub-text); margin-bottom: 20px; font-size: 1rem; }
    </style>
</head>
<body>

    <div id="setup-gate" class="token-gate">
        <div class="gate-box">
            <h2>🔒 Security Setup</h2>
            <p id="gate-msg">Reading system configurations...</p>
        </div>
    </div>

    <div class="container" id="main-container">
        <!-- Top Half: Current Conditions Dashboard -->
        <div class="weather-card" id="main-card">
            <div class="hero-left">
                <div>
                    <div class="location-title" id="display-location">Loading Location...</div>
                    <div class="condition-state" id="current-condition">Loading...</div>
                </div>
                <div class="temp-display" id="current-temp">--°C</div>
            </div>
            <div class="hero-right">
                <div class="weather-icon" id="current-icon">☁️</div>
                <div class="extra-metrics" id="current-metrics">
                    Humidity: --%<br>
                    Wind: -- km/h
                </div>
            </div>
        </div>

        <!-- Bottom Half: Hourly Forecast Strips -->
        <div class="forecast-strip" id="forecast-card">
            <div id="forecast-container" style="display: flex; width: 100%; height: 100%; justify-content: space-between;"></div>
        </div>
    </div>

    <script>
        const HA_URL = window.location.origin; 
        let CONFIG = null;
        let ACCESS_TOKEN = localStorage.getItem('ha_secure_token');

        const iconMap = {
            'clear-night': '🌙', 'cloudy': '☁️', 'fog': '🌫️', 'hail': '🌧️', 
            'lightning': '⛈️', 'lightning-rain': '⛈️', 'partlycloudy': '⛅', 
            'pouring': '🌧️', 'rainy': '🌦️', 'snowy': '❄️', 'snowy-rainy': '🌨️', 
            'sunny': '☀️', 'windy': '💨', 'windy-variant': '💨', 'exceptional': '☀️'
        };

        const currentTemp = document.getElementById('current-temp');
        const currentCondition = document.getElementById('current-condition');
        const currentIcon = document.getElementById('current-icon');
        const currentMetrics = document.getElementById('current-metrics');
        const forecastContainer = document.getElementById('forecast-container');
        const setupGate = document.getElementById('setup-gate');
        const gateMsg = document.getElementById('gate-msg');
        const displayLocation = document.getElementById('display-location');

        /* 
           The Sandboxed Layout Engine:
           We bypass CSS media/viewport parsing by manually reading the 
           window frame properties and directly mapping pixels.
        */
        function layoutEngine() {
            const displayW = window.innerWidth;
            const displayH = window.innerHeight;
            
            // Choose the shorter screen axis as our sizing index
            const layoutScale = Math.min(displayW, displayH);
            
            // Layout Calculations
            const bodyPadding = Math.round(layoutScale * 0.04);
            const panelGap = Math.round(layoutScale * 0.03);
            const cardRadius = Math.round(layoutScale * 0.025);
            
            // Apply Master Container Constraints
            const mainContainer = document.getElementById('main-container');
            mainContainer.style.padding = `${bodyPadding}px`;
            mainContainer.style.gap = `${panelGap}px`;
            
            // Determine structural heights dynamically
            const fullyAvailableH = displayH - (bodyPadding * 2) - panelGap;
            const topCardH = Math.round(fullyAvailableH * 0.58);
            const bottomCardH = Math.round(fullyAvailableH * 0.42);
            
            // Apply Top Card Proportions
            const mainCard = document.getElementById('main-card');
            mainCard.style.height = `${topCardH}px`;
            mainCard.style.borderRadius = `${cardRadius}px`;
            mainCard.style.padding = `${Math.round(topCardH * 0.12)}px`;
            
            // Apply Top Fonts
            document.querySelector('.location-title').style.fontSize = `${Math.round(topCardH * 0.14)}px`;
            document.querySelector('.condition-state').style.fontSize = `${Math.round(topCardH * 0.08)}px`;
            currentTemp.style.fontSize = `${Math.round(topCardH * 0.42)}px`;
            currentIcon.style.fontSize = `${Math.round(topCardH * 0.38)}px`;
            currentMetrics.style.fontSize = `${Math.round(topCardH * 0.085)}px`;
            
            // Apply Bottom Card Proportions
            const forecastCard = document.getElementById('forecast-card');
            forecastCard.style.height = `${bottomCardH}px`;
            forecastCard.style.borderRadius = `${cardRadius}px`;
            forecastCard.style.padding = `${Math.round(bottomCardH * 0.15)}px`;
            
            // Dynamically balance sub-child text blocks inside the forecast layout
            const elementsToScale = {
                '.day-name': 0.16,
                '.day-icon': 0.36,
                '.day-temp-high': 0.18
            };
            
            for (const [selector, scalingFactor] of Object.entries(elementsToScale)) {
                document.querySelectorAll(selector).forEach(el => {
                    el.style.fontSize = `${Math.round(bottomCardH * scalingFactor)}px`;
                });
            }
        }

        async function bootSequence() {
            // Run scaling calculations immediately on startup
            layoutEngine();
            window.addEventListener('resize', layoutEngine);

            try {
                const configResponse = await fetch('weather_config.json');
                if (!configResponse.ok) throw new Error("config_fault");
                const configData = await configResponse.json();
                CONFIG = configData.ui_configuration;
                displayLocation.innerText = CONFIG.panel_title;

                if (!ACCESS_TOKEN) {
                    const tokenResponse = await fetch('token.txt');
                    if (!tokenResponse.ok) throw new Error("token_missing");
                    const tokenText = await tokenResponse.text();
                    ACCESS_TOKEN = tokenText.trim();
                    
                    if (!ACCESS_TOKEN) throw new Error("token_empty");
                    localStorage.setItem('ha_secure_token', ACCESS_TOKEN);
                }

                setupGate.style.display = 'none';
                initWebSocket();

            } catch (err) {
                setupGate.style.display = 'flex';
                if (err.message === "config_fault") {
                    gateMsg.innerHTML = '<span style="color:#ef4444">Error loading weather_config.json</span>';
                } else if (err.message === "token_missing" || err.message === "token_empty") {
                    gateMsg.innerHTML = '<span style="color:#ef4444">Token file missing or empty.<br>Verify your /www/token.txt credentials.</span>';
                } else {
                    gateMsg.innerHTML = '<span style="color:#ef4444">System Initialization Error</span>';
                }
            }
        }

        function initWebSocket() {
            const wsUrl = HA_URL.replace(/^http/, 'ws') + '/api/websocket';
            const socket = new WebSocket(wsUrl);

            socket.onopen = () => {
                socket.send(JSON.stringify({ type: "auth", access_token: ACCESS_TOKEN }));
            };

            socket.onmessage = (event) => {
                const res = JSON.parse(event.data);

                if (res.type === "auth_invalid") {
                    localStorage.removeItem('ha_secure_token');
                    setupGate.style.display = 'flex';
                    gateMsg.innerHTML = '<span style="color:#ef4444">Authentication Failed.<br>Check credentials inside token.txt</span>';
                    socket.close();
                }

                if (res.type === "auth_ok") {
                    socket.send(JSON.stringify({ id: 2, type: "get_states" }));
                    socket.send(JSON.stringify({ 
                        id: 3, 
                        type: "weather/subscribe_forecast", 
                        entity_id: CONFIG.weather_entity, 
                        forecast_type: "hourly" 
                    }));
                }

                if (res.id === 2 && res.type === "result") {
                    const stateObj = res.result.find(s => s.entity_id === CONFIG.weather_entity);
                    if (stateObj) updateCurrentWeather(stateObj);
                }

                if (res.type === "event" && res.id === 3) {
                    if (res.event && res.event.forecast) {
                        updateForecastUI(res.event.forecast);
                    }
                }
            };

            socket.onclose = () => {
                setTimeout(initWebSocket, 5000);
            };
        }

        function updateCurrentWeather(stateObj) {
            const attrs = stateObj.attributes || {};
            const stateStr = stateObj.state || '';

            currentTemp.textContent = `${attrs.temperature || '--'}°C`;
            currentCondition.textContent = stateStr.replace(/-/g, ' ');
            currentIcon.textContent = iconMap[stateStr.toLowerCase().replace(/[^a-z-]/g, '')] || '☀️';
            
            currentMetrics.innerHTML = `
                Humidity: ${attrs.humidity || '--'}%<br>
                Wind: ${attrs.wind_speed || '--'} km/h
            `;
        }

        function updateForecastUI(forecastArray) {
            forecastContainer.innerHTML = '';
            
            forecastArray.slice(0, 5).forEach(interval => {
                const dateObj = new Date(interval.datetime);
                const labelText = dateObj.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
                const iconSymbol = iconMap[interval.condition?.toLowerCase().replace(/[^a-z-]/g, '')] || '☀️';

                const dayDiv = document.createElement('div');
                dayDiv.className = 'forecast-day';
                dayDiv.innerHTML = `
                    <div class="day-name">${labelText}</div>
                    <div class="day-icon">${iconSymbol}</div>
                    <div class="day-temp-high">${interval.temperature || '--'}°</div>
                `;
                forecastContainer.appendChild(dayDiv);
            });
            
            // Recalibrate styles for newly generated forecast cards
            layoutEngine();
        }

        bootSequence();
    </script>
</body>
</html>
