<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no">


    <title>🔘 Instant Input Button Controller</title>
    <style>
        :root {
            --bg-color: #0f0f11;
            --card-color: #16161a;
            --text-color: #f1f5f9;
            --accent-color: #38bdf8;
            --border-color: #27272a;
            --sub-text: #a1a1aa;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 20px;
            overflow: hidden; /* Prevents touch dragging */
            height: 100vh;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 2px solid var(--border-color);
        }

        h1 { font-size: 2.3rem; font-weight: 800; }

        .button-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            flex-grow: 1;
            padding-bottom: 20px;
        }

        /* High-response tactile push button styling */
        .push-btn {
            background-color: var(--card-color);
            border: 2px solid var(--border-color);
            border-radius: 14px;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            
            /* Eliminates double-tap zoom delay entirely */
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            
            transition: transform 0.05s ease, border-color 0.05s ease, background 0.05s ease;
        }

        .button-logo {
            max-width: 80%;
            max-height: 55px;
            object-fit: contain;
            filter: invert(1) brightness(0.9);
            pointer-events: none; /* Stops image selection on rapid taps */
            transition: filter 0.05s ease, transform 0.05s ease;
        }

        /* Instant visual feedback when pressed */
        .push-btn:active, 
        .push-btn.pressed {
            transform: scale(0.95);
            border-color: var(--accent-color);
            background: linear-gradient(145deg, #1e293b, #16161a);
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.4);
        }

        .push-btn:active .button-logo, 
        .push-btn.pressed .button-logo {
            filter: none;
            transform: scale(1.02);
        }

        .indicator {
            position: absolute;
            top: 14px;
            right: 16px;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #27272a;
            border: 1px solid #3f3f46;
            pointer-events: none;
            transition: background-color 0.05s ease, box-shadow 0.05s ease;
        }

        .push-btn:active .indicator,
        .push-btn.pressed .indicator {
            background-color: var(--accent-color);
            box-shadow: 0 0 8px var(--accent-color);
            border-color: transparent;
        }

        .token-gate {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(15, 15, 17, 0.98);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            z-index: 9999;
        }

        .gate-box {
            background: var(--card-color);
            border: 1px solid var(--border-color);
            padding: 30px;
            border-radius: 12px;
            max-width: 500px;
            width: 100%;
            text-align: center;
        }
        .gate-box h2 { font-size: 1.8rem; margin-bottom: 12px; }
        .gate-box p { color: var(--sub-text); margin-bottom: 20px; }
    </style>
</head>
<body>

    <!-- Setup Gate Overlay -->
    <div id="setup-gate" class="token-gate">
        <div class="gate-box">
            <h2>🔒 Initializing Button Controller</h2>
            <p id="gate-msg">Reading local configurations...</p>
        </div>
    </div>

    <div class="container">
        <header>
            <h1 id="panel-title-text">Button Controller</h1>
        </header>

        <!-- Dynamic Grid -->
        <div class="button-grid" id="grid-container"></div>
    </div>

    <script>
        // =========================================================================
        // KIOSK CACHE PURGER ENGINE
        // Unregisters lingering Service Workers and flushes browser caches.
        // =========================================================================
        async function nukeKioskCaches() {
            if ('serviceWorker' in navigator) {
                try {
                    const registrations = await navigator.serviceWorker.getRegistrations();
                    for (let registration of registrations) {
                        await registration.unregister();
                        console.log('[System Kernel] Unregistered stubborn ServiceWorker:', registration);
                    }
                } catch (e) {
                    console.warn('[System Kernel] SW purge fault:', e);
                }
            }

            if ('caches' in window) {
                try {
                    const keys = await caches.keys();
                    for (let key of keys) {
                        await caches.delete(key);
                        console.log('[System Kernel] Cleared CacheStorage key:', key);
                    }
                } catch (e) {
                    console.warn('[System Kernel] CacheStorage purge fault:', e);
                }
            }
        }

        const HA_URL = window.location.origin; 
        
        let FULL_CONFIG = null;
        let ACCESS_TOKEN = localStorage.getItem('ha_secure_token');
        let messageId = 10; 
        let socket = null;

        const setupGate = document.getElementById('setup-gate');
        const gateMsg = document.getElementById('gate-msg');
        const gridContainer = document.getElementById('grid-container');
        const panelTitleText = document.getElementById('panel-title-text');

        // Bootstrapping Phase
        async function bootstrapApplication() {
            // Execute the anti-cache flush sequence immediately on startup
            await nukeKioskCaches();

            try {
                // Microsecond precision timestamp cache-buster
                const cacheBuster = Date.now();
                const response = await fetch(`button_config.json?t=${cacheBuster}`, {
                    cache: 'no-store'
                });
                
                if (!response.ok) throw new Error(`HTTP Error ${response.status}: Failed to read button_config.json`);
                
                FULL_CONFIG = await response.json(); 
                
                if (FULL_CONFIG.ui_configuration && FULL_CONFIG.ui_configuration.stations) {
                    buildButtonInterfaceGrid(FULL_CONFIG.ui_configuration.stations);
                }

                if (FULL_CONFIG.ui_configuration && FULL_CONFIG.ui_configuration.panel_title) {
                    panelTitleText.textContent = FULL_CONFIG.ui_configuration.panel_title;
                }

                if (!ACCESS_TOKEN) {
                    await tryLoadingTokenFromFile();
                } else {
                    setupGate.style.display = 'none';
                    initButtonController();
                }
            } catch (err) {
                setupGate.style.display = 'flex';
                gateMsg.innerHTML = `<span style="color:#ef4444; font-weight:bold;">Initialization Fault:<br>${err.message}</span>`;
            }
        }

        // Render UI Grid
        function buildButtonInterfaceGrid(stations) {
            gridContainer.innerHTML = ''; 
            
            stations.forEach(station => {
                const btn = document.createElement('div');
                btn.className = 'push-btn';
                btn.setAttribute('data-id', station.entity_id);
                
                const logoUrl = station.logo_path ? `${station.logo_path}?t=${Date.now()}` : '';

                btn.innerHTML = `
                    <div class="indicator"></div>
                    <img class="button-logo" src="${logoUrl}" alt="${station.display_name}">
                `;
                
                gridContainer.appendChild(btn);
            });
        }

        // Token File Loader
        async function tryLoadingTokenFromFile() {
            try {
                if (!FULL_CONFIG.token_configuration || !FULL_CONFIG.token_configuration.filename) {
                    throw new Error("JSON profile configuration is missing token filename.");
                }

                const tokenFilename = FULL_CONFIG.token_configuration.filename;
                gateMsg.innerText = `Checking file system for ${tokenFilename}...`;
                
                const cacheBuster = Date.now();
                const response = await fetch(`${tokenFilename}?t=${cacheBuster}`, {
                    cache: 'no-store'
                });

                if (!response.ok) throw new Error(`Could not load or find path: '${tokenFilename}'`);
                
                const fileText = await response.text();
                const cleanToken = fileText.trim();
                
                if (cleanToken.length > 10) {
                    localStorage.setItem('ha_secure_token', cleanToken);
                    ACCESS_TOKEN = cleanToken;
                    
                    gateMsg.innerText = "Token verified! Loading interface...";
                    setTimeout(() => {
                        setupGate.style.display = 'none';
                        initButtonController();
                    }, 800);
                } else {
                    throw new Error(`Extracted token string from '${tokenFilename}' was too short.`);
                }
            } catch (err) {
                gateMsg.innerHTML = `<span style="color:#ef4444">Configuration Error!<br>${err.message}</span>`;
            }
        }

        // WebSocket Pipeline
        function initButtonController() {
            const wsUrl = HA_URL.replace(/^http/, 'ws') + '/api/websocket';
            socket = new WebSocket(wsUrl);

            socket.onopen = () => {
                socket.send(JSON.stringify({ type: "auth", access_token: ACCESS_TOKEN }));
            };

            socket.onmessage = (event) => {
                const response = JSON.parse(event.data);

                if (response.type === "auth_invalid") {
                    localStorage.removeItem('ha_secure_token');
                    window.location.reload();
                }

                if (response.type === "auth_ok") {
                    socket.send(JSON.stringify({ id: 1, type: "subscribe_events", event_type: "state_changed" }));
                }
            };

            socket.onclose = () => {
                setTimeout(initButtonController, 1000);
            };
        }

        // Rapid execution trigger
        function handleStationPress(btn, evt) {
            // Prevent browser tap-zoom and secondary mouse events
            if (evt) {
                evt.preventDefault();
                evt.stopPropagation();
            }

            const entityId = btn.getAttribute('data-id');
            
            // Fast visual pulse animation (120ms instead of 200ms for quick feedback)
            btn.classList.add('pressed');
            setTimeout(() => btn.classList.remove('pressed'), 120);

            // Send payload immediately down open socket
            if (socket && socket.readyState === WebSocket.OPEN) {
                socket.send(JSON.stringify({
                    id: messageId++, 
                    type: "call_service",
                    domain: "input_button",
                    service: "press",
                    service_data: { entity_id: entityId }
                }));
            }
        }

        // Bind directly to low-latency pointer events
        const pressEvent = window.PointerEvent ? 'pointerdown' : 'touchstart';

        gridContainer.addEventListener(pressEvent, (e) => {
            const btn = e.target.closest('.push-btn');
            if (btn) {
                handleStationPress(btn, e);
            }
        }, { passive: false });

        // Fallback for standard mouse clicks on desktop browsers
        gridContainer.addEventListener('click', (e) => {
            const btn = e.target.closest('.push-btn');
            if (btn && (e.button === 0 || e.button === undefined)) {
                // If it was already handled by pointerdown, this prevents duplicate calls
                if (e.detail > 1) return; 
                handleStationPress(btn, e);
            }
        });

        // Initialize App
        bootstrapApplication();
    </script>
</body>
</html>
