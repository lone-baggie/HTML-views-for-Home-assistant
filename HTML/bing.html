<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Bing Screensaver</title>
    <style>
        :root {
            --text-color: #ffffff;
            --kiosk-brightness: 100%;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        html, body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #0d0e12;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: var(--text-color);
            filter: brightness(var(--kiosk-brightness));
            transition: filter 2s ease-in-out;
        }

        /* Fullscreen photo stages */
        .stage {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            opacity: 0;
            transition: opacity 2.5s ease-in-out;
            z-index: 1;
        }

        .stage.active {
            opacity: 1;
            z-index: 2;
        }

        /* Ambient fallback background gradient */
        .fallback-gradient {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, #1e1e24 0%, #0f0f11 100%);
            z-index: 0;
        }

        /* Ambient dark vignette scrim to make the font pop */
        .scrim {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, rgba(0,0,0,0.1) 0%, rgba(0,0,0,0.1) 50%, rgba(0,0,0,0.7) 100%);
            z-index: 3;
            pointer-events: none;
        }

        /* Heads Up Display Overlay */
        .hud-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 4;
            display: flex;
            flex-direction: row;       
            justify-content: flex-start; 
            align-items: flex-end;     
            pointer-events: none;
        }

        .clock-display {
            font-weight: 700;
            line-height: 0.82; 
            letter-spacing: -2px; 
            text-align: left;
            text-shadow: 0 4px 20px rgba(0,0,0,0.8);
        }

        /* The right-hand column containing Date (top) and Description (bottom) */
        .info-stack {
            display: flex;
            flex-direction: column;   
            align-items: flex-start;  
            justify-content: flex-end;
            text-shadow: 0 4px 15px rgba(0,0,0,0.8);
        }

        .date-display {
            font-weight: 400;
            color: rgba(255, 255, 255, 0.9);
            text-align: left;
            line-height: 1.1;
            white-space: nowrap;
        }

        /* Description line pinned cleanly under the date */
        .copyright-credit {
            font-family: monospace;
            color: rgba(255, 255, 255, 0.6);
            pointer-events: none;
            max-width: 100%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            text-align: left;
            line-height: 1.2;
        }

        /* Simple loading container overlay */
        .boot-screen {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: #0f0f11;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            font-size: 1.3rem;
            transition: opacity 1s ease;
            color: #a1a1aa;
        }
    </style>
</head>
<body>

    <div id="boot-gate" class="boot-screen">Checking Engine Manifest...</div>

    <div class="fallback-gradient"></div>

    <div id="stage-a" class="stage"></div>
    <div id="stage-b" class="stage"></div>
    <div class="scrim"></div>

    <div class="hud-container" id="hud-frame">
        <span class="clock-display" id="clock">00:00</span>
        
        <div class="info-stack" id="meta-stack">
            <span class="date-display" id="date">Loading Date...</span>
            <div class="copyright-credit" id="image-credit">Bing Daily Wallpaper</div>
        </div>
    </div>

    <script>
        /* 
           THE CACHE BUSTER ENGINE 
           Executed immediately before the DOM starts rendering image data.
        */
        (function() {
            const currentUrl = new URL(window.location.href);
            
            if (!currentUrl.searchParams.has('cb')) {
                const cacheBusterToken = Date.now();
                currentUrl.searchParams.set('cb', cacheBusterToken);
                window.location.replace(currentUrl.toString());
            }
        })();

        const stageA = document.getElementById('stage-a');
        const stageB = document.getElementById('stage-b');
        const bootGate = document.getElementById('boot-gate');
        const clockEl = document.getElementById('clock');
        const dateEl = document.getElementById('date');
        const creditEl = document.getElementById('image-credit');
        const metaStackEl = document.getElementById('meta-stack');
        
        let currentStage = stageA;
        let wallpaperList = [];
        let activeWallIndex = 0;
        let rotationTimer = null;

        // Base Fallback Configuration Parameters (Will be overridden by JSON file)
        let systemConfig = {
            rotation_timeout_minutes: 5,
            clock_format_24h: true,
            date_locale: "en-GB",
            timezone: "Europe/London"
        };

        // Reads system configuration options out of the external tracking manifest
        async function loadExternalConfiguration() {
            try {
                // Appending a timestamp query string keeps the browser from caching the json structure natively
                const response = await fetch(`bing_config.json?t=${Date.now()}`);
                if (!response.ok) throw new Error(`HTTP target exception: Status ${response.status}`);
                
                const data = await response.json();
                if (data && data.system_config) {
                    systemConfig = { ...systemConfig, ...data.system_config };
                    console.log("Configuration Engine parsed successfully:", systemConfig);
                }
            } catch (err) {
                console.warn("Could not read configuration file. Reverting to internal defaults.", err);
            }
        }

        // Calculates exact dimensions based on screen geometry to keep text perfectly aligned
        function layoutEngine() {
            const displayW = window.innerWidth;
            const displayH = window.innerHeight;
            const layoutScale = Math.min(displayW, displayH);

            const paddingSide = Math.round(displayW * 0.02); 
            const paddingBottom = Math.round(layoutScale * 0.012);
            const horizontalGap = Math.round(layoutScale * 0.03);

            const hudFrame = document.getElementById('hud-frame');
            hudFrame.style.padding = `${paddingBottom}px ${paddingSide}px ${paddingBottom}px ${paddingSide}px`;
            hudFrame.style.gap = `${horizontalGap}px`;

            // Adjust layout slightly to drop the text scaling down a small fraction if the AM/PM tag stretches the layout boundaries
            const clockScaleFactor = systemConfig.clock_format_24h ? 0.16 : 0.13;

            clockEl.style.fontSize = `${Math.round(layoutScale * clockScaleFactor)}px`;
            dateEl.style.fontSize = `${Math.round(layoutScale * 0.042)}px`;
            
            creditEl.style.fontSize = `${Math.round(layoutScale * 0.022)}px`;
            creditEl.style.marginTop = `${Math.round(layoutScale * 0.014)}px`;
            metaStackEl.style.paddingBottom = `${Math.round(layoutScale * 0.016)}px`;
        }

        // Tries primary proxy, then fails over to secondary proxy if network fails
        async function fetchWithProxyFallback(targetUrl) {
            const proxies = [
                (url) => `https://corsproxy.io/?${encodeURIComponent(url)}`,
                (url) => `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`
            ];

            for (let i = 0; i < proxies.length; i++) {
                try {
                    const proxiedUrl = proxies[i](targetUrl);
                    const response = await fetch(proxiedUrl);
                    if (!response.ok) throw new Error(`Proxy ${i} returned status ${response.status}`);
                    return await response.json();
                } catch (err) {
                    console.warn(`Proxy channel ${i} failed, attempting next route...`, err);
                }
            }
            throw new Error("All public proxy vectors exhausted.");
        }

        // Hits the external Bing daily endpoints directly from the browser
        async function fetchBingWallpapers() {
            const apiPage1 = "https://www.bing.com/HPImageArchive.aspx?format=js&idx=0&n=8&mkt=en-US";
            const apiPage2 = "https://www.bing.com/HPImageArchive.aspx?format=js&idx=8&n=8&mkt=en-US";

            try {
                const [response1, response2] = await Promise.all([
                    fetchWithProxyFallback(apiPage1),
                    fetchWithProxyFallback(apiPage2)
                ]);

                const batch1 = response1?.images || [];
                const batch2 = response2?.images || [];
                const combinedRaw = [...batch1, ...batch2];

                if (combinedRaw.length > 0) {
                    const uniqueImages = [];
                    const seenUrls = new Set();

                    for (const img of combinedRaw) {
                        if (!seenUrls.has(img.url)) {
                            seenUrls.add(img.url);
                            uniqueImages.push({
                                url: `https://www.bing.com${img.url}`,
                                copyright: img.copyright
                            });
                        }
                    }

                    wallpaperList = uniqueImages;
                    rotateImage();
                } else {
                    throw new Error("Empty image manifests.");
                }
            } catch (err) {
                console.error("Network down or proxies rate-limited. Booting Scenic Fallback Mode.", err);
                
                wallpaperList = Array.from({length: 16}, (_, i) => ({
                    url: `https://picsum.photos/id/${[10, 29, 43, 48, 56, 76, 96, 124, 133, 145, 163, 175, 188, 197, 212, 230][i]}/${window.innerWidth}/${window.innerHeight}`,
                    copyright: "Scenic Landscape (Local Fallback Mode)"
                }));
                rotateImage();
            }
        }

        // Fades between hidden image layers using the DOM for smooth transitions
        function rotateImage() {
            if (wallpaperList.length === 0) return;

            const nextStage = (currentStage === stageA) ? stageB : stageA;
            const currentItem = wallpaperList[activeWallIndex];
            
            const imgLoader = new Image();
            imgLoader.src = currentItem.url;
            
            imgLoader.onload = () => {
                nextStage.style.backgroundImage = `url('${currentItem.url}')`;
                creditEl.textContent = currentItem.copyright;
                
                currentStage.classList.remove('active');
                nextStage.classList.add('active');
                
                currentStage = nextStage;
                dismissBootScreen();
                
                activeWallIndex = (activeWallIndex + 1) % wallpaperList.length;
            };

            imgLoader.onerror = () => {
                dismissBootScreen();
                activeWallIndex = (activeWallIndex + 1) % wallpaperList.length;
            };
        }

        function dismissBootScreen() {
            if (bootGate.style.opacity !== '0') {
                bootGate.style.opacity = '0';
                setTimeout(() => bootGate.style.display = 'none', 1000);
            }
        }

        // Keeps local time active and updates screen dimming thresholds for evening hours
        function startClock() {
            function update() {
                const now = new Date();
                
                // Using standard options allows toLocaleTimeString to natively map AM/PM suffixes
                const clockOptions = {
                    hour: '2-digit',
                    minute: '2-digit',
                    hour12: !systemConfig.clock_format_24h,
                    timeZone: systemConfig.timezone
                };
                
                const dateOptions = {
                    weekday: 'long',
                    day: 'numeric',
                    month: 'long',
                    timeZone: systemConfig.timezone
                };
                
                clockEl.textContent = now.toLocaleTimeString(systemConfig.date_locale, clockOptions);
                dateEl.textContent = now.toLocaleDateString(systemConfig.date_locale, dateOptions);
                
                const currentHour = now.getHours();
                if (currentHour >= 20 || currentHour < 6) {
                    document.documentElement.style.setProperty('--kiosk-brightness', '35%');
                } else {
                    document.documentElement.style.setProperty('--kiosk-brightness', '100%');
                }
            }
            update();
            setInterval(update, 1000);
        }

        // Flushes internal browser state completely once every 6 hours 
        function setupHardReloadDaemon() {
            setInterval(() => {
                const cleanUrl = new URL(window.location.origin + window.location.pathname);
                window.location.replace(cleanUrl.toString());
            }, 21600000); 
        }

        // Initialize display loop routines
        async function init() {
            // Wait for configuration parsing before initializing clock formats and layout engines
            await loadExternalConfiguration();

            layoutEngine();
            window.addEventListener('resize', layoutEngine);

            startClock();
            fetchBingWallpapers();
            setupHardReloadDaemon();

            // Set up interval dynamically based on parsed parameters
            const rotationMs = systemConfig.rotation_timeout_minutes * 60 * 1000;
            rotationTimer = setInterval(rotateImage, rotationMs); 

            setInterval(fetchBingWallpapers, 21600000); 
        }

        init();
    </script>
</body>
</html>
