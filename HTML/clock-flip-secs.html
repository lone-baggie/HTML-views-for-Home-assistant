<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  
  <!-- CACHE CONTROL HEADERS: Prevents browsers & HA webviews from storing old copies -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <title>Flip Clock with Seconds</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow&family=Barlow+Condensed&family=Saira+Extra+Condensed:wght@400;700&display=swap" rel="stylesheet">

  <!-- jQuery Library -->
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

  <style>
    /* CSS STYLES */
    :root {
      --clockwidth: 480px;
      --clockheight: 220px;
      --radius: 30px;
      --rotationtime: 0.45s; /* Snappier animation to handle card flips */
    }

    html, body {
      box-sizing: border-box;
      background: transparent; /* Transparent for HA webview cards */
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    html *,
    html *::before,
    html *::after {
      box-sizing: inherit;
      padding: 0;
      margin: 0;
    }

    /* 1. OUTER FRAME (Shell Structure - Fixed Target Dimensions for 3 Cards) */
    .outer-frame {
      display: block;
      width: 536px;
      height: 276px;
      padding: 16px;
      border-radius: calc(var(--radius) + 12px);
      background-image: linear-gradient(
        135deg,
        rgb(55, 54, 60) 0%,
        rgb(28, 27, 31) 50%,
        rgb(15, 15, 18) 100%
      );
      box-shadow: 
        0 20px 35px rgba(0, 0, 0, 0.65),
        inset 0 2px 3px rgba(255, 255, 255, 0.25),
        inset 0 -2px 5px rgba(0, 0, 0, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.08);
      transform-origin: center center;
    }

    /* 2. INNER FRAME (Clock Body - 3 Column Layout) */
    .clock {
      display: grid;
      padding: 0 12px;
      grid-template-columns: 144px 144px 144px;
      grid-column-gap: 12px;
      width: var(--clockwidth);
      height: var(--clockheight);
      border-radius: var(--radius);
      background-image: linear-gradient(
        rgb(14, 14, 15) 0%,
        rgb(26, 25, 28) 20%,
        rgb(44, 44, 52) 50%,
        rgb(20, 20, 27) 100%
      );
      box-shadow: inset 0 -3px 6px 3px rgba(0, 0, 0, 0.2),
        inset 0 4px 8px 3px rgba(0, 0, 0, 0.4),
        0 2px 3px 1px rgba(255, 255, 255, 0.3), 0 -2px 4px 4px rgba(56, 56, 61, 0.5);
    }

    .flipper {
      position: relative;
      width: 144px;
      height: 220px;
      transform-style: preserve-3d;
      perspective: 1600px;
    }

    .gear {
      position: absolute;
      top: 73px;
      width: 12px;
      height: 73px;
      background: linear-gradient(
        to bottom,
        #000000 0%,
        #666666 17%,
        #7f7f7f 52%,
        #7f7f7f 52%,
        #0c0c0c 53%,
        #595959 87%,
        #131313 100%
      );
      outline: 3px solid #000;
      z-index: 99;
      transform-style: preserve-3d;
      transform: translateZ(10px);
      perspective: 0;
    }

    .gear:nth-child(2) {
      left: 132px;
    }

    .top,
    .bottom {
      box-shadow: 0 6px 6px 1px rgba(0, 0, 0, 0.5),
        0 2px 2px 1px rgba(255, 255, 255, 0.15);
      border-top: 2px solid rgb(102, 103, 110);
      border-bottom: 2px solid #000;
      overflow: hidden;
    }

    .top {
      position: relative;
      width: 100%;
      height: 95px;
      background-image: linear-gradient(rgb(48, 49, 53) 0%, rgb(56, 57, 62) 100%);
      margin-top: 10px;
      margin-bottom: 5px;
      border-top-left-radius: 19.5px;
      border-top-right-radius: 19.5px;
    }

    .bottom {
      position: relative;
      width: 100%;
      height: 95px;
      background-image: linear-gradient(rgb(57, 58, 63) 0%, rgb(65, 65, 71) 100%);
      margin-top: 5px;
      margin-bottom: 10px;
      border-bottom-left-radius: 19.5px;
      border-bottom-right-radius: 19.5px;
    }

    /* TYPOGRAPHY */
    .text {
      color: #ffffff !important;
      -webkit-text-fill-color: #ffffff !important;
      font-size: 160px;
      display: block;
      position: absolute;
      width: 100%;
      height: 100%;
      line-height: 190px;
      text-align: center;
      font-family: "Saira Extra Condensed", sans-serif;
    }

    .bottom .text {
      line-height: 190px;
      top: -95px;
    }

    /* RETRO LED BULB LIGHT BASE STYLES */
    .pm-indicator {
      position: absolute;
      bottom: 12px;
      right: 14px;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      border: 1px solid #111;
      box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.8), 0 1px 1px rgba(255, 255, 255, 0.1);
      z-index: 100;
      transition: background-color 0.3s ease, box-shadow 0.3s ease;
      display: none;
    }

    /* AM STATE: Illuminated Retro Green Glow */
    .pm-indicator.am {
      background-color: #00e640;
      box-shadow: 
        0 0 4px #00e640,
        0 0 8px #00b332,
        inset 0 1px 1px #fff;
    }

    /* PM STATE: Illuminated Retro Red Glow */
    .pm-indicator.pm {
      background-color: #ff2a2a;
      box-shadow: 
        0 0 4px #ff2a2a,
        0 0 8px #b30000,
        inset 0 1px 1px #fff;
    }

    .top.new,
    .bottom.new {
      position: absolute;
      left: 0;
      z-index: 12;
    }

    .top.new {
      top: 0;
      z-index: 1;
    }

    .top.new .text {
      backface-visibility: hidden;
    }

    .bottom.new {
      position: absolute;
      top: 0;
      height: 100%;
      transform: rotateX(0.5turn);
      z-index: 1;
      opacity: 0;
    }

    .flipper.flipping .top.new {
      transform-origin: bottom center;
      animation: rotate var(--rotationtime) 1 ease-in-out forwards;
    }

    .flipper.flipping .bottom.new {
      animation: rotatebottom var(--rotationtime) 1 ease-in-out forwards;
    }

    @keyframes rotatebottom {
      0% { opacity: 0; }
      49% { opacity: 0; }
      50% { opacity: 1; }
      100% { opacity: 1; }
    }

    @keyframes rotate {
      0% { transform: rotateX(0) translateY(0px); }
      100% { transform: rotateX(-180deg) translateY(-10px); }
    }
  </style>
</head>
<body>

  <!-- TRIPLE FRAME HTML STRUCTURE -->
  <div class="outer-frame" id="clock-frame">
    <div class="clock">
      <!-- Hours Card -->
      <div class="flipper flipper-hour">
        <div class="gear"></div>
        <div class="gear"></div>
        <div class="top">
          <div class="text"></div>
        </div>
        <div class="bottom">
          <div class="text"></div>
        </div>
      </div>

      <!-- Minutes Card -->
      <div class="flipper flipper-minute">
        <div class="gear"></div>
        <div class="gear"></div>
        <div class="top">
          <div class="text"></div>
        </div>
        <div class="bottom">
          <div class="text"></div>
          <!-- Retro AM/PM Indicator Light -->
          <div class="pm-indicator" id="pm-bulb" title="AM/PM Indicator"></div>
        </div>
      </div>

      <!-- Seconds Card -->
      <div class="flipper flipper-second">
        <div class="gear"></div>
        <div class="gear"></div>
        <div class="top">
          <div class="text"></div>
        </div>
        <div class="bottom">
          <div class="text"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- JAVASCRIPT LOGIC -->
  <script>
    /* DYNAMIC AUTO-SCALER FUNCTION */
    function resizeClock() {
      var frame = document.getElementById('clock-frame');
      if (!frame) return;
      
      var targetWidth = 536;
      var targetHeight = 276;
      var windowWidth = window.innerWidth;
      var windowHeight = window.innerHeight;

      // Compute exact ratio needed to fit inside the HA iframe card
      var scaleX = windowWidth / targetWidth;
      var scaleY = windowHeight / targetHeight;
      var scale = Math.min(scaleX, scaleY);

      // Apply CSS scale transform dynamically
      frame.style.transform = 'scale(' + scale + ')';
    }

    // Attach resize listeners
    window.addEventListener('resize', resizeClock);
    window.addEventListener('load', resizeClock);

    /* Default fallback config */
    var config = {
      time_format: "24"
    };

    var lastHour = null;
    var lastMinute = null;
    var lastSecond = null;

    function flipCard(cardElement, newValue) {
      // Clean up lingering cloned nodes prior to starting a new flip
      cardElement.find(".new").remove();
      cardElement.removeClass("flipping");

      var topHalf = cardElement.find(".top").first();
      var bottomHalf = cardElement.find(".bottom").first();

      var topClone = topHalf.clone().addClass("new");
      var bottomClone = bottomHalf.clone().addClass("new");

      bottomClone.find(".text").text(newValue);

      topHalf.after(topClone);
      topClone.append(bottomClone);

      cardElement.addClass("flipping");
      topHalf.find(".text").text(newValue);

      setTimeout(function () {
        bottomHalf.find(".text").text(newValue);
        cardElement.removeClass("flipping");
        cardElement.find(".new").remove();
      }, 450); // Matches --rotationtime CSS variable
    }

    function updateClock() {
      var date = new Date();
      var rawHours = date.getHours();
      var rawMinutes = date.getMinutes();
      var rawSeconds = date.getSeconds();

      var displayHours = rawHours;

      /* 12-HOUR VS 24-HOUR FORMATTING LOGIC */
      if (String(config.time_format) === "12") {
        var isPM = rawHours >= 12;

        $("#pm-bulb").show();
        
        // Swap bulb colors based on AM/PM state
        if (isPM) {
          $("#pm-bulb").removeClass("am").addClass("pm");
        } else {
          $("#pm-bulb").removeClass("pm").addClass("am");
        }

        displayHours = displayHours % 12;
        if (displayHours === 0) {
          displayHours = 12;
        }
      } else {
        // Hide indicator entirely in 24h format and clear classes
        $("#pm-bulb").hide().removeClass("am pm");
      }

      /* STRING FORMATTING (PADDING) */
      var hourStr = displayHours.toString().padStart(2, '0');
      var minuteStr = rawMinutes.toString().padStart(2, '0');
      var secondStr = rawSeconds.toString().padStart(2, '0');

      var hourCard = $(".flipper-hour");
      var minuteCard = $(".flipper-minute");
      var secondCard = $(".flipper-second");

      /* TRIGGER FLIPS ON VALUE CHANGE */
      if (lastHour !== hourStr) {
        lastHour = hourStr;
        flipCard(hourCard, hourStr);
      }

      if (lastMinute !== minuteStr) {
        lastMinute = minuteStr;
        flipCard(minuteCard, minuteStr);
      }

      if (lastSecond !== secondStr) {
        lastSecond = secondStr;
        flipCard(secondCard, secondStr);
      }
    }

    $(function () {
      resizeClock();
      // Attempt to load external clock-flip.json config with cache-busting timestamp
      fetch('clock-flip.json?t=' + new Date().getTime())
        .then(function(response) {
          if (!response.ok) {
            throw new Error("Local config JSON not found, using script defaults.");
          }
          return response.json();
        })
        .then(function(data) {
          config = data;
        })
        .catch(function(err) {
          console.warn("Config load notice:", err);
        })
        .finally(function() {
          // Initial tick call
          updateClock();

          // Loop every second
          setInterval(updateClock, 1000);
        });
    });
  </script>

</body>
</html>
